# Локальная модель на своей GPU (профиль llm-local): vLLM с OpenAI-совместимым API.
#
# Два способа запуска (подробно — docs/local-model.md):
#  1) рядом со стендом, как дополнение к основному compose — воркер ходит на http://vllm:8000/v1:
#       docker compose -f docker-compose.yml -f infra/llm/compose.llm-local.yml --profile llm-local up -d vllm
#  2) отдельно, своим проектом на GPU-сервере (стенд может быть на другой машине):
#       cd ~/hr_llm && docker compose -p hr_llm -f compose.llm-local.yml --profile llm-local up -d
#     порт 8000 публикуется ТОЛЬКО на 127.0.0.1 сервера; с другой машины — SSH-туннель
#     ssh -N -L 8000:127.0.0.1:8000 <пользователь>@<сервер>, тогда LOCAL_LLM_URL=http://host.docker.internal:8000/v1.
# Веса, имя и ключ — в .env (LOCAL_LLM_MODEL, LOCAL_LLM_SERVED_NAME, VLLM_API_KEY).
# Проверено на A10 24 ГБ с Qwen/Qwen3-VL-4B-Instruct — см. docs/local-model.md.
services:
  vllm:
    profiles: ["llm-local"]
    image: vllm/vllm-openai:v0.11.0
    command:
      - --model=${LOCAL_LLM_MODEL:?задайте LOCAL_LLM_MODEL в .env}
      - --served-model-name=${LOCAL_LLM_SERVED_NAME:-local-qwen}
      - --api-key=${VLLM_API_KEY:?задайте VLLM_API_KEY в .env (make secrets)}
      - --max-model-len=16384
      - --max-num-seqs=4
      - --gpu-memory-utilization=0.90
      - '--limit-mm-per-prompt={"image": 2}'
      - --enable-prefix-caching
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host  # vLLM использует разделяемую память для обмена между процессами
    ports:
      - "127.0.0.1:8000:8000"  # только локально на сервере; наружу порт не открывается
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # backend — чтобы воркер стенда ходил на http://vllm:8000/v1; egress — для скачивания весов.
    networks: [backend, egress]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      # В образе может не быть curl — проверяем средствами python.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s

networks:
  backend:
    internal: true
  egress: {}

volumes:
  hf_cache:
