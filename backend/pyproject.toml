[project]
name = "hr-docs-backend"
version = "0.1.0"
description = "Приём документов соискателей: API, воркер, пайплайн разбора"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.12",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pillow>=11.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["app/registry", "app/llm", "app/pipeline"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
