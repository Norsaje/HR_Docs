# Стенд «Приём документов соискателей». Запуск: docker compose up -d --build
# Сети: backend — внутренняя (без выхода в интернет), edge — только Caddy (порты наружу),
# egress — только worker (выход к модели и OCR). Наружу открыты только 80/443 Caddy;
# отладочные 8081 (админка Keycloak) и 8025 (Mailpit) — только на 127.0.0.1 хоста.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD (make secrets)}
      HR_OWNER_PASSWORD: ${HR_OWNER_PASSWORD:?}
      HR_APP_PASSWORD: ${HR_APP_PASSWORD:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    <<: *hardening
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "/opt/hr/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - s3_data:/data
      - ./infra/seaweedfs/entrypoint.sh:/opt/hr/entrypoint.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.3.5
    command:
      - start
      - --import-realm
      - --hostname=${PUBLIC_BASE_URL:?}/kc
      - --hostname-admin=${KC_ADMIN_URL:-http://localhost:8081/kc}
      - --hostname-backchannel-dynamic=true
      - --http-enabled=true
      - --http-relative-path=/kc
      - --http-management-relative-path=/
      - --proxy-headers=xforwarded
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Переменные для плейсхолдеров ${...} в realm-hr.json (подставляются при импорте).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:?}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?}
      KC_DEMO_PASSWORD: ${KC_DEMO_PASSWORD:?}
    volumes:
      - ./infra/keycloak/realm-hr.json:/opt/keycloak/data/import/realm-hr.json:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # В образе нет curl: шлём HTTP-запрос через /dev/tcp средствами bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "2000"
    networks: [backend]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hr-docs/backend:local
    env_file: .env
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_started}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: hr-docs/caddy:local
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8025:8025"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      api: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Для интеграционных тестов: make test. Данные в tmpfs, порт только на 127.0.0.1.
  postgres-test:
    image: postgres:17.11-alpine
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: hr_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_test"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  backend:
    internal: true
  edge: {}
  egress: {}
  test: {}

volumes:
  pg_data:
  s3_data:
  caddy_data:
  caddy_config:
