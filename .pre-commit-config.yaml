# Перед каждым коммитом: поиск секретов (gitleaks), линтер и форматтер Python (ruff),
# форматтер фронтенда (prettier). gitleaks берётся из системы (winget/apt/brew), чтобы не собирать Go.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (поиск секретов в индексе)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|eval)/
      - id: ruff-format
        files: ^(backend|eval)/
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        files: ^web/.*\.(ts|tsx|css|json)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
